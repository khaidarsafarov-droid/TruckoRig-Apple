name: macOS

# Public-repo macOS minutes. macos-latest is a GitHub-hosted runner, not a paid larger runner.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        run: |
          set -euo pipefail
          developer_dir="$(python3 - <<'PY'
          import pathlib
          import plistlib
          import sys

          found = []
          for app in pathlib.Path("/Applications").glob("Xcode*.app"):
              label = app.name.lower()
              if "beta" in label or "-rc" in label or "release candidate" in label:
                  continue
              version_plist = app / "Contents" / "version.plist"
              if not version_plist.exists():
                  continue
              with version_plist.open("rb") as handle:
                  info = plistlib.load(handle)
              short = str(info.get("CFBundleShortVersionString", "0"))
              parts = []
              for piece in short.split("."):
                  digits = "".join(ch for ch in piece if ch.isdigit())
                  parts.append(int(digits) if digits else 0)
              found.append((tuple(parts), short, app))
          if not found:
              raise SystemExit("No stable Xcode is installed on this runner")
          found.sort()
          _, short, chosen = found[-1]
          print(f"Using {chosen.name} ({short})", file=sys.stderr)
          print(chosen / "Contents" / "Developer")
          PY
          )"
          sudo xcode-select -s "$developer_dir"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/sims.json
          python3 - <<'PY'
          import json
          import os
          data = json.load(open("/tmp/sims.json"))
          phones = []
          for runtime, entries in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if not device.get("isAvailable", True):
                      continue
                  name = device.get("name", "")
                  if not name.startswith("iPhone"):
                      continue
                  phones.append(device)
          if not phones:
              raise SystemExit("No available iPhone simulator")
          phones.sort(key=lambda device: device["name"])
          chosen = phones[-1]
          print(f"Using {chosen['name']} ({chosen['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={chosen['udid']}\n")
              handle.write(f"name={chosen['name']}\n")
          PY

      - name: Build the app and widget, then run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project TruckoRig.xcodeproj \
            -scheme TruckoRig \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:TruckoRigTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-
