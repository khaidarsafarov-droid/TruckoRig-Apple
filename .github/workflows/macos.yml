name: macOS

# Public-repo macOS minutes. macos-latest is a GitHub-hosted runner, not a paid larger runner.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ios-simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 Node 24

      - name: Select the latest stable Xcode
        run: |
          set -euo pipefail
          developer_dir="$(python3 - <<'PY'
          import pathlib
          import plistlib
          import sys

          found = []
          for app in pathlib.Path("/Applications").glob("Xcode*.app"):
              label = app.name.lower()
              if "beta" in label or "-rc" in label or "release candidate" in label:
                  continue
              version_plist = app / "Contents" / "version.plist"
              if not version_plist.exists():
                  continue
              with version_plist.open("rb") as handle:
                  info = plistlib.load(handle)
              short = str(info.get("CFBundleShortVersionString", "0"))
              parts = []
              for piece in short.split("."):
                  digits = "".join(ch for ch in piece if ch.isdigit())
                  parts.append(int(digits) if digits else 0)
              found.append((tuple(parts), short, app))
          if not found:
              raise SystemExit("No stable Xcode is installed on this runner")
          found.sort()
          _, short, chosen = found[-1]
          print(f"Using {chosen.name} ({short})", file=sys.stderr)
          print(chosen / "Contents" / "Developer")
          PY
          )"
          sudo xcode-select -s "$developer_dir"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Choose simulators
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/sims.json
          python3 - <<'PY'
          import json
          import os
          data = json.load(open("/tmp/sims.json"))

          def pick(prefix):
              found = []
              for runtime, entries in data.get("devices", {}).items():
                  if "iOS" not in runtime:
                      continue
                  for device in entries:
                      if not device.get("isAvailable", True):
                          continue
                      name = device.get("name", "")
                      if name.startswith(prefix):
                          found.append(device)
              if not found:
                  raise SystemExit(f"No available {prefix} simulator")
              found.sort(key=lambda device: device["name"])
              return found[-1]

          phone = pick("iPhone")
          pad = pick("iPad")
          print(f"Using {phone['name']} ({phone['udid']})")
          print(f"Using {pad['name']} ({pad['udid']})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={phone['udid']}\n")
              handle.write(f"name={phone['name']}\n")
              handle.write(f"ipad_udid={pad['udid']}\n")
              handle.write(f"ipad_name={pad['name']}\n")
          PY

      - name: Use the software keyboard for UI tests
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Unit tests on iPhone
        run: |
          set -euo pipefail
          Tools/run_simulator_tests.sh \
            --udid "${{ steps.simulator.outputs.udid }}" \
            --derived "$RUNNER_TEMP/iphone" \
            --result "$RUNNER_TEMP/iphone.xcresult" \
            --only-testing TruckoRigTests \
            --coverage \
            --require-keychain

      - name: Copy goal percent screenshots
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/goal-percent-shots"
          mkdir -p "$out"
          udid="${{ steps.simulator.outputs.udid }}"
          container="$(xcrun simctl get_app_container "$udid" com.truckorig data 2>/dev/null || true)"
          if [[ -n "${container}" && -d "${container}/Documents/goal-percent-shots" ]]; then
            cp -R "${container}/Documents/goal-percent-shots/." "$out/"
            echo "Copied goal percent screenshots"
            find "$out" -type f -print
          else
            echo "No goal percent screenshots in the app container"
            echo "container=${container:-missing}"
          fi

      - name: UI tests on iPhone
        run: |
          set -euo pipefail
          Tools/run_simulator_tests.sh \
            --udid "${{ steps.simulator.outputs.udid }}" \
            --derived "$RUNNER_TEMP/iphone" \
            --result "$RUNNER_TEMP/ui.xcresult" \
            --only-testing TruckoRigUITests \
            --no-build

      - name: Unit tests on iPad
        run: |
          set -euo pipefail
          Tools/run_simulator_tests.sh \
            --udid "${{ steps.simulator.outputs.ipad_udid }}" \
            --derived "$RUNNER_TEMP/ipad" \
            --result "$RUNNER_TEMP/ipad.xcresult" \
            --only-testing TruckoRigTests \
            --require-keychain

      - name: Upload goal percent screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal-percent-shots
          path: ${{ runner.temp }}/goal-percent-shots
          if-no-files-found: warn
