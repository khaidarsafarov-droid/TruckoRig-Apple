name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  domain-tests:
    name: Domain tests
    runs-on: ubuntu-latest
    # The domain layer is Foundation-only on purpose, so it can be tested without macOS runners.
    container: swift:6.0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 Node 24
      - name: Install unzip
        run: apt-get update && apt-get install -y unzip
      - name: swift test
        run: swift test

  project-file:
    name: Project file and strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 Node 24
      - name: Validate project.pbxproj
        run: python3 Tools/validate_pbxproj.py
      - name: Validate the string catalog
        run: python3 Tools/check_strings.py
      - name: Check App Store screenshot frames
        run: python3 Tools/render_app_store_screenshots.py --check
      - name: Check the generator output is committed
        run: |
          python3 Tools/generate_xcodeproj.py
          git diff --exit-code -- TruckoRig.xcodeproj \
            || (echo "::error::TruckoRig.xcodeproj is stale — run python3 Tools/generate_xcodeproj.py" && exit 1)

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5 Node 24
      - name: Install SwiftLint 0.65.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          echo "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d  /tmp/swiftlint.zip" | sha256sum -c -
          unzip -p /tmp/swiftlint.zip swiftlint-static > /usr/local/bin/swiftlint
          chmod +x /usr/local/bin/swiftlint
          swiftlint version
      - name: Lint
        run: swiftlint lint --strict
